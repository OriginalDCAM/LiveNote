name: Build (ci)

run-name: ${{ github.actor }} is running the build workflow

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      with:
        path: 'LiveNote.SPA'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'


      - run: npm ci

      - run: npm run build