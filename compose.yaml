services:
  mongodb:
    container_name: mongo
    image: mongo
    restart: always
    environment:
      - MONGO_INIT_DB_ROOT_USERNAME:user
      - MONGO_INIT_DB_ROOT_PASSWORD:root
    volumes:
      - livenote.mongodb.data:/data/db
    networks:
      - livenote.mongodb.network
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_MONGODB_SERVER: mongo 
      ME_CONFIG_MONGODB_ADMINUSERNAME: user
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: user 
      ME_CONFIG_BASICAUTH_PASSWORD: root
    depends_on:
      - mongodb 
    networks:
      - livenote.mongodb.network

volumes:
  livenote.mongodb.data:
    driver: local


networks:
  livenote.mongodb.network:
    driver: bridge


    