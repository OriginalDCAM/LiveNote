services:
  mongodb:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - livenote.mongodb.data:/data/db
    networks:
      - livenote.mongodb.network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://user:root@mongodb:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: user 
      ME_CONFIG_BASICAUTH_PASSWORD: root
    depends_on:
        mongodb:
          condition: service_healthy
    networks:
      - livenote.mongodb.network

volumes:
  livenote.mongodb.data:
    driver: local


networks:
  livenote.mongodb.network:
    driver: bridge